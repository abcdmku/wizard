name: Systems Docker CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: systems-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dx:
    name: DX audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with history for merge-base detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DX audit
        run: pnpm dx:audit

  system:
    name: ${{ matrix.system }}
    needs: dx
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: 01-intake
            path: systems/01-intake
          - system: 02-fleet
            path: systems/02-fleet
          - system: 03-fulfillment
            path: systems/03-fulfillment
          - system: 04-dungeon
            path: systems/04-dungeon

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, seed, and test system
        env:
          SYSTEM_NAME: ${{ matrix.system }}
          SYSTEM_PATH: ${{ matrix.path }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/systems-ci.sh"

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: systems-${{ matrix.system }}-logs
          path: ${{ runner.temp }}/wizard-systems/${{ matrix.system }}
          if-no-files-found: ignore
