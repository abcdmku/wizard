name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Type-test canary (the typecheck harness must fail on a real type error)
        run: pnpm test:canary
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm size
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: pnpm check:api
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: pnpm check:docs
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: pnpm check:public-tags
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - run: pnpm examples
