name: openwizard-intake

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intake}
      POSTGRES_USER: ${POSTGRES_USER:-intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intake-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - intake-postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: systems/01-intake/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4310
      DATABASE_URL: postgres://${POSTGRES_USER:-intake}:${POSTGRES_PASSWORD:-intake-local-only}@postgres:5432/${POSTGRES_DB:-intake}
      REVIEW_WORKER_URL: http://review-worker:4320
      DEMO_TENANT_ID: ${INTAKE_TENANT_ID:-demo-grants}
    ports:
      - "${INTAKE_API_PORT:-4310}:4310"
    depends_on:
      postgres:
        condition: service_healthy
      review-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  review-worker:
    build:
      context: ../..
      dockerfile: systems/01-intake/review-worker/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4320
      DATABASE_URL: postgres://${POSTGRES_USER:-intake}:${POSTGRES_PASSWORD:-intake-local-only}@postgres:5432/${POSTGRES_DB:-intake}
      JOB_DURATION_MS: ${INTAKE_JOB_DURATION_MS:-5000}
    ports:
      - "${INTAKE_WORKER_PORT:-4320}:4320"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4320/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: systems/01-intake/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${INTAKE_API_BASE_URL:-}
    environment:
      API_BASE_URL: http://api:4310
    ports:
      - "${INTAKE_WEB_PORT:-4300}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  intake-postgres:
