<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" role="img" aria-labelledby="projection-title projection-desc">
  <title id="projection-title">Projected state and authenticated commands</title>
  <desc id="projection-desc">A server run sends selected state through a projection and versioned frames to a browser mirror. Browser commands return through an authenticated transport to the server run.</desc>
  <style>
    text { font-family: "Geist Mono Variable", ui-monospace, monospace; fill: var(--d-ink); font-size: 13px; }
    .cap { font-size: 10px; fill: var(--d-muted); letter-spacing: .08em; }
    .node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
    .wire { fill: none; stroke: var(--d-muted); stroke-width: 1.5; marker-end: url(#projection-arrow); }
  </style>
  <defs>
    <marker id="projection-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="var(--d-muted)"/>
    </marker>
  </defs>
  <text class="cap" x="22" y="30">STATE TO BROWSER</text>
  <rect class="node" x="22" y="48" width="150" height="48" rx="8"/>
  <text x="97" y="78" text-anchor="middle">server Run</text>
  <path class="wire" d="M172 72h54"/>
  <rect class="node" x="234" y="48" width="130" height="48" rx="8"/>
  <text x="299" y="78" text-anchor="middle">projection</text>
  <path class="wire" d="M364 72h54"/>
  <rect class="node" x="426" y="48" width="162" height="48" rx="8"/>
  <text x="507" y="78" text-anchor="middle">versioned frame</text>
  <path class="wire" d="M588 72h54"/>
  <rect class="node" x="650" y="48" width="158" height="48" rx="8"/>
  <text x="729" y="78" text-anchor="middle">browser mirror</text>
  <text class="cap" x="22" y="145">COMMAND TO SERVER</text>
  <rect class="node" x="22" y="162" width="150" height="48" rx="8"/>
  <text x="97" y="192" text-anchor="middle">browser command</text>
  <path class="wire" d="M172 186h74"/>
  <rect class="node" x="254" y="162" width="198" height="48" rx="8"/>
  <text x="353" y="192" text-anchor="middle">authenticated transport</text>
  <path class="wire" d="M452 186h74"/>
  <rect class="node" x="534" y="162" width="172" height="48" rx="8"/>
  <text x="620" y="192" text-anchor="middle">server dispatch</text>
  <path class="wire" d="M706 186h54"/>
  <text x="822" y="192" text-anchor="middle">Run</text>
</svg>
