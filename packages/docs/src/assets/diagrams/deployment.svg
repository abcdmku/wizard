<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="deployment-title deployment-desc">
  <title id="deployment-title">Provider artifact build</title>
  <desc id="deployment-desc">One typed TypeScript host enters Nitro. Nitro builds one artifact per selected preset, producing outputs for Node, AWS Lambda, Azure Static Web Apps, Firebase App Hosting, Cloudflare Workers, Vercel, and Netlify.</desc>
  <style>
    svg { --d-paper: #fff; --d-surface: #fafafa; --d-ink: #171717; --d-muted: #737373; --d-line: #d4d4d4; --d-soft: #f5f5f5; --d-inverse: #fff; }
    @media (prefers-color-scheme: dark) { svg { --d-paper: #0a0a0a; --d-surface: #151515; --d-ink: #fafafa; --d-muted: #a3a3a3; --d-line: #404040; --d-soft: #1f1f1f; --d-inverse: #0a0a0a; } }
    text { font-family: "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--d-ink); }
    .name { font-size: 18px; }
    .hero { font-size: 21px; }
    .cap { font-size: 13.5px; letter-spacing: .1em; fill: var(--d-muted); }
    .api { font-size: 13.5px; fill: var(--d-muted); }
    .on { fill: var(--d-inverse); }
    .on-dim { fill: var(--d-inverse); opacity: .6; }
    .plate { fill: none; stroke: var(--d-line); stroke-width: 1.5; }
    .node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.75; }
    .solid { fill: var(--d-ink); stroke: var(--d-ink); stroke-width: 1.75; }
    .wire { fill: none; stroke: var(--d-muted); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#dp-tip); }
    .bus { fill: none; stroke: var(--d-muted); stroke-width: 1.75; stroke-linecap: round; }
    .dot { fill: var(--d-muted); }
    .port { fill: var(--d-inverse); }
  </style>
  <defs>
    <marker id="dp-tip" viewBox="0 0 9 8" markerWidth="9" markerHeight="8" markerUnits="userSpaceOnUse" refX="8.6" refY="4" orient="auto">
      <path d="M0 .4 8.6 4 0 7.6 2.1 4Z" fill="var(--d-muted)"/>
    </marker>
    <pattern id="dp-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="var(--d-line)"/>
    </pattern>
  </defs>

  <rect x="16" y="16" width="888" height="448" rx="22" fill="url(#dp-grid)" opacity=".5"/>
  <rect class="plate" x="16" y="16" width="888" height="448" rx="22"/>
  <text class="cap" x="56" y="56">BUILD</text>
  <text class="cap" x="440" y="56">TARGETS</text>

  <rect class="node" x="56" y="78" width="240" height="76" rx="14"/>
  <text class="name" x="80" y="112">app.ts</text>
  <text class="cap" x="80" y="136">ONE TYPED HOST</text>

  <rect class="solid" x="56" y="194" width="240" height="92" rx="18"/>
  <text class="hero on" x="80" y="238">Nitro</text>
  <text class="api on-dim" x="80" y="262">nitro build --preset</text>

  <rect class="node" x="56" y="326" width="240" height="76" rx="14"/>
  <text class="name" x="80" y="360">artifact</text>
  <text class="cap" x="80" y="384">ONE PER TARGET</text>

  <path class="wire" d="M176 154v34"/>
  <path class="wire" d="M176 286v34"/>
  <circle class="dot" cx="176" cy="154" r="3.25"/>
  <circle class="port" cx="176" cy="286" r="3.25"/>

  <path class="bus" d="M296 364h88M384 98v324"/>
  <circle class="dot" cx="384" cy="364" r="4.25"/>

  <rect class="node" x="440" y="76" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="104">Node</text>
  <text class="api" x="842" y="103" text-anchor="end">node_server</text>

  <rect class="node" x="440" y="130" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="158">AWS Lambda</text>
  <text class="api" x="842" y="157" text-anchor="end">aws_lambda</text>

  <rect class="node" x="440" y="184" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="212">Azure SWA</text>
  <text class="api" x="842" y="211" text-anchor="end">azure-swa</text>

  <rect class="node" x="440" y="238" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="266">Firebase</text>
  <text class="api" x="842" y="265" text-anchor="end">firebase_app_hosting</text>

  <rect class="node" x="440" y="292" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="320">Cloudflare</text>
  <text class="api" x="842" y="319" text-anchor="end">cloudflare_module</text>

  <rect class="node" x="440" y="346" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="374">Vercel</text>
  <text class="api" x="842" y="373" text-anchor="end">vercel</text>

  <rect class="node" x="440" y="400" width="424" height="44" rx="12"/>
  <text class="name" x="462" y="428">Netlify</text>
  <text class="api" x="842" y="427" text-anchor="end">netlify</text>

  <path class="wire" d="M384 98h50"/>
  <path class="wire" d="M384 152h50"/>
  <path class="wire" d="M384 206h50"/>
  <path class="wire" d="M384 260h50"/>
  <path class="wire" d="M384 314h50"/>
  <path class="wire" d="M384 368h50"/>
  <path class="wire" d="M384 422h50"/>
</svg>
