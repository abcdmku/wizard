<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="runtime-title runtime-desc">
  <title id="runtime-title">OpenWizard runtime loop</title>
  <desc id="runtime-desc">A command enters decide, which produces events. Apply folds events into state. Plan turns state into effects. Each effect result returns to decide, closing the loop.</desc>
  <style>
    svg { --d-paper: #fff; --d-surface: #fafafa; --d-ink: #171717; --d-muted: #737373; --d-line: #d4d4d4; --d-soft: #f5f5f5; --d-inverse: #fff; }
    @media (prefers-color-scheme: dark) { svg { --d-paper: #0a0a0a; --d-surface: #151515; --d-ink: #fafafa; --d-muted: #a3a3a3; --d-line: #404040; --d-soft: #1f1f1f; --d-inverse: #0a0a0a; } }
    text { font-family: "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--d-ink); }
    .name { font-size: 18px; }
    .cap { font-size: 13.5px; letter-spacing: .1em; fill: var(--d-muted); }
    .ord { font-size: 12.5px; fill: var(--d-muted); opacity: .75; }
    .on { fill: var(--d-inverse); }
    .on-dim { fill: var(--d-inverse); opacity: .6; }
    .plate { fill: none; stroke: var(--d-line); stroke-width: 1.5; }
    .node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.75; }
    .solid { fill: var(--d-ink); stroke: var(--d-ink); stroke-width: 1.75; }
    .wire { fill: none; stroke: var(--d-muted); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#rt-tip); }
    .dot { fill: var(--d-muted); }
    .port { fill: var(--d-inverse); }
  </style>
  <defs>
    <marker id="rt-tip" viewBox="0 0 9 8" markerWidth="9" markerHeight="8" markerUnits="userSpaceOnUse" refX="8.6" refY="4" orient="auto">
      <path d="M0 .4 8.6 4 0 7.6 2.1 4Z" fill="var(--d-muted)"/>
    </marker>
    <pattern id="rt-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.1" cy="1.1" r="1.1" fill="var(--d-line)"/>
    </pattern>
  </defs>

  <rect x="16" y="16" width="888" height="368" rx="22" fill="url(#rt-grid)" opacity=".5"/>
  <rect class="plate" x="16" y="16" width="888" height="368" rx="22"/>
  <text class="cap" x="48" y="52">ONE QUEUE, ONE HISTORY</text>

  <rect class="node" x="56" y="84" width="172" height="76" rx="14"/>
  <text class="ord" x="208" y="108" text-anchor="end">1</text>
  <text class="name" x="78" y="118">command</text>
  <text class="cap" x="78" y="142">INPUT</text>

  <rect class="node" x="268" y="84" width="172" height="76" rx="14"/>
  <text class="ord" x="420" y="108" text-anchor="end">2</text>
  <text class="name" x="290" y="118">decide</text>
  <text class="cap" x="290" y="142">PURE</text>

  <rect class="node" x="480" y="84" width="172" height="76" rx="14"/>
  <text class="ord" x="632" y="108" text-anchor="end">3</text>
  <text class="name" x="502" y="118">events</text>
  <text class="cap" x="502" y="142">COMMITTED</text>

  <rect class="node" x="692" y="84" width="172" height="76" rx="14"/>
  <text class="ord" x="844" y="108" text-anchor="end">4</text>
  <text class="name" x="714" y="118">apply</text>
  <text class="cap" x="714" y="142">PURE</text>

  <rect class="solid" x="692" y="240" width="172" height="76" rx="14"/>
  <text class="ord on-dim" x="844" y="264" text-anchor="end">5</text>
  <text class="name on" x="714" y="274">state</text>
  <text class="cap on-dim" x="714" y="298">DERIVED</text>

  <rect class="node" x="480" y="240" width="172" height="76" rx="14"/>
  <text class="ord" x="632" y="264" text-anchor="end">6</text>
  <text class="name" x="502" y="274">plan</text>
  <text class="cap" x="502" y="298">PURE</text>

  <rect class="solid" x="268" y="240" width="172" height="76" rx="14"/>
  <text class="ord on-dim" x="420" y="264" text-anchor="end">7</text>
  <text class="name on" x="290" y="274">effects</text>
  <text class="cap on-dim" x="290" y="298">SIDE EFFECTS</text>

  <rect class="node" x="56" y="240" width="172" height="76" rx="14"/>
  <text class="ord" x="208" y="264" text-anchor="end">8</text>
  <text class="name" x="78" y="274">result</text>
  <text class="cap" x="78" y="298">BACK IN</text>

  <path class="wire" d="M228 122h34"/>
  <path class="wire" d="M440 122h34"/>
  <path class="wire" d="M652 122h34"/>
  <path class="wire" d="M778 160v74"/>
  <path class="wire" d="M692 278h-34"/>
  <path class="wire" d="M480 278h-34"/>
  <path class="wire" d="M268 278h-34"/>
  <path class="wire" d="M142 240v-26a14 14 0 0 1 14-14h184a14 14 0 0 0 14-14v-20"/>

  <circle class="dot" cx="228" cy="122" r="3.25"/>
  <circle class="dot" cx="440" cy="122" r="3.25"/>
  <circle class="dot" cx="652" cy="122" r="3.25"/>
  <circle class="dot" cx="778" cy="160" r="3.25"/>
  <circle class="port" cx="692" cy="278" r="3.25"/>
  <circle class="dot" cx="480" cy="278" r="3.25"/>
  <circle class="port" cx="268" cy="278" r="3.25"/>
  <circle class="dot" cx="142" cy="240" r="3.25"/>
</svg>
