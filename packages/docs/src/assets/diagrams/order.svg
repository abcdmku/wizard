<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="order-title order-desc">
  <title id="order-title">Order workflow and its compensations</title>
  <desc id="order-desc">The order reserves inventory, charges the customer, requests shipment, waits for shipment, and finishes. Reserve can release inventory and charge can refund.</desc>
  <style>
    text { font-family: "Geist Mono Variable", ui-monospace, monospace; fill: var(--d-ink); font-size: 13px; }
    .small { font-size: 11px; fill: var(--d-muted); }
    .node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
    .wire { fill: none; stroke: var(--d-muted); stroke-width: 1.5; marker-end: url(#order-arrow); }
    .undo { fill: none; stroke: var(--d-line); stroke-width: 1.5; marker-end: url(#order-arrow); }
  </style>
  <defs>
    <marker id="order-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="var(--d-muted)"/>
    </marker>
  </defs>
  <rect class="node" x="20" y="54" width="120" height="50" rx="8"/>
  <text x="80" y="85" text-anchor="middle">reserve</text>
  <path class="wire" d="M140 79h28"/>
  <rect class="node" x="176" y="54" width="112" height="50" rx="8"/>
  <text x="232" y="85" text-anchor="middle">charge</text>
  <path class="wire" d="M288 79h28"/>
  <rect class="node" x="324" y="54" width="166" height="50" rx="8"/>
  <text x="407" y="85" text-anchor="middle">requestShipment</text>
  <path class="wire" d="M490 79h28"/>
  <rect class="node" x="526" y="54" width="156" height="50" rx="8"/>
  <text x="604" y="85" text-anchor="middle">awaitShipment</text>
  <path class="wire" d="M682 79h28"/>
  <rect class="node" x="718" y="54" width="104" height="50" rx="8"/>
  <text x="770" y="85" text-anchor="middle">shipped</text>
  <path class="undo" d="M80 104v56"/>
  <path class="undo" d="M232 104v56"/>
  <rect class="node" x="20" y="168" width="120" height="44" rx="8"/>
  <text class="small" x="80" y="195" text-anchor="middle">release inventory</text>
  <rect class="node" x="176" y="168" width="112" height="44" rx="8"/>
  <text class="small" x="232" y="195" text-anchor="middle">refund charge</text>
  <text class="small" x="328" y="194">used if later work fails</text>
</svg>
