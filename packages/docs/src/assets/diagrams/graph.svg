<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="graph-title graph-desc">
  <title id="graph-title">An ingest graph with fan-out, join, and branch</title>
  <desc id="graph-desc">Ingest starts normalize and enrich. Both join at gate. Gate chooses persist or quarantine, and persist continues to done.</desc>
  <style>
    text { font-family: "Geist Mono Variable", ui-monospace, monospace; fill: var(--d-ink); font-size: 14px; }
    .node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
    .wire { fill: none; stroke: var(--d-muted); stroke-width: 1.5; marker-end: url(#graph-arrow); }
    .branch { font-size: 11px; fill: var(--d-muted); }
  </style>
  <defs>
    <marker id="graph-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="var(--d-muted)"/>
    </marker>
  </defs>
  <rect class="node" x="30" y="123" width="120" height="54" rx="8"/>
  <text x="90" y="156" text-anchor="middle">ingest</text>
  <path class="wire" d="M150 150h48c30 0 28-73 58-73h34"/>
  <path class="wire" d="M150 150h48c30 0 28 73 58 73h34"/>
  <rect class="node" x="298" y="50" width="138" height="54" rx="8"/>
  <text x="367" y="83" text-anchor="middle">normalize</text>
  <rect class="node" x="298" y="196" width="138" height="54" rx="8"/>
  <text x="367" y="229" text-anchor="middle">enrich</text>
  <path class="wire" d="M436 77h34c30 0 28 73 58 73h28"/>
  <path class="wire" d="M436 223h34c30 0 28-73 58-73h28"/>
  <rect class="node" x="564" y="123" width="100" height="54" rx="8"/>
  <text x="614" y="156" text-anchor="middle">gate</text>
  <path class="wire" d="M664 150h30c28 0 26-67 54-67h18"/>
  <path class="wire" d="M664 150h30c28 0 26 67 54 67h18"/>
  <text class="branch" x="700" y="97">valid</text>
  <text class="branch" x="695" y="208">invalid</text>
  <rect class="node" x="774" y="56" width="106" height="54" rx="8"/>
  <text x="827" y="89" text-anchor="middle">persist</text>
  <rect class="node" x="774" y="190" width="116" height="54" rx="8"/>
  <text x="832" y="223" text-anchor="middle">quarantine</text>
  <path class="wire" d="M880 83h26"/>
  <rect class="node" x="914" y="56" width="70" height="54" rx="8"/>
  <text x="949" y="89" text-anchor="middle">done</text>
</svg>
