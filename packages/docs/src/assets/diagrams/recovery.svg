<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" role="img" aria-labelledby="recovery-title recovery-desc">
  <title id="recovery-title">A remote success followed by a worker crash</title>
  <desc id="recovery-desc">The ledger accepts the request. The worker then crashes before it saves the successful result, leaving the remote outcome ambiguous.</desc>
  <style>
    text { font-family: "Geist Mono Variable", ui-monospace, monospace; fill: var(--d-ink); font-size: 14px; }
    .small { font-size: 11px; fill: var(--d-muted); }
    .node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
    .wire { fill: none; stroke: var(--d-muted); stroke-width: 1.5; marker-end: url(#recovery-arrow); }
  </style>
  <defs>
    <marker id="recovery-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="var(--d-muted)"/>
    </marker>
  </defs>
  <rect class="node" x="30" y="54" width="190" height="56" rx="8"/>
  <text x="125" y="79" text-anchor="middle">ledger accepted</text>
  <text class="small" x="125" y="97" text-anchor="middle">invoice:INV-7</text>
  <path class="wire" d="M220 82h70"/>
  <rect class="node" x="298" y="54" width="174" height="56" rx="8"/>
  <text x="385" y="79" text-anchor="middle">worker stopped</text>
  <text class="small" x="385" y="97" text-anchor="middle">process memory lost</text>
  <path class="wire" d="M472 82h70"/>
  <rect class="node" x="550" y="54" width="240" height="56" rx="8"/>
  <text x="670" y="79" text-anchor="middle">success was not saved</text>
  <text class="small" x="670" y="97" text-anchor="middle">outcome is ambiguous</text>
  <path d="M125 110v38h545v-38" fill="none" stroke="var(--d-line)" stroke-width="1.5"/>
  <text class="small" x="398" y="169" text-anchor="middle">resume with the same idempotency key</text>
</svg>
